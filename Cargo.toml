[workspace]
default-members = ["rusvid_cli"]
members = ["rusvid_lib", "rusvid_cli", "rusvid_server", "crates/*"]

[workspace.dependencies]
anyhow = "1.0.66"
approx = "0.5.1"
axum = "0.6.12"
bincode = "1.3.3"
cairo-rs = "0.17.0"
chrono = "0.4.24"
concat-idents = "1.1.4"
console_error_panic_hook = "0.1.7"
criterion = "0.4"
derive_more = "0.99.17"
easer = "0.3.0"
fern = "0.6.2"
ffmpeg-sys-next = { version = "6.0.1", default-features = false }
flo_curves = "0.6.1"
geo = "0.24.1"
glam = "0.22.0"
image = "0.24"
image-compare = "0.2.3"
itertools = "0.10.5"
js-sys = "0.3.60"
lazy_static = "1.4.0"
log = "0.4.17"
mime = "0.3.17"
miniz_oxide = "0.7.1"
multipart = { version = "0.18.0", default-features = false }
paste = "1.0.12"
png = "0.17.7"
r2d2 = "0.8.10"
rand = "0.8.5"
rayon = "1.7.0"
redis = "0.23.0"
resvg = { version = "0.32.0", default-features = false }
rhai = "1.12.0"
rust-s3 = "0.32.3"
serde = "1.0.159"
serde_json = "1.0.95"
serde_yaml = "0.9.21"
static_assertions = "1.1.0"
strum = "0.24"
thiserror = "1.0.40"
tokio = "1.27.0"
tokio-util = "0.7.7"
tower = "0.4.13"
tower-http = "0.4.0"
ureq = "2.6.2"
url = "2.3.1"
uuid = { version = "1.2.2", default-features = false }
wasm-bindgen = "0.2.63"
web-sys = { version = "0.3.60", default-features = false }

[workspace.package]
version = "0.2.1"
license = "Apache-2.0"
repository = "https://github.com/LetsMelon/rusvid"
